<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kestrel Launcher</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="titlebar">
        <span class="title">Kestrel Launcher</span>
        <div class="controls">
            <button data-action="minimize" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10" /></svg></button>
            <button data-action="maximize" title="Maximize" aria-label="Maximize"><svg id="maxIcon" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" /></svg></button>
            <button data-action="close" class="close" title="Close" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" /></svg></button>
        </div>
    </div>

    <div class="shell">
        <aside class="sidebar">
            <div class="wordmark">Kestrel</div>
            <nav>
                <button class="nav-item" data-page="mods" aria-current="page">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2" /><rect x="13.5" y="3" width="7.5" height="7.5" rx="2" /><rect x="3" y="13.5" width="7.5" height="7.5" rx="2" /><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" /></svg>
                    Mods
                </button>
                <button class="nav-item nav-bottom" data-page="settings">
                    <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M4 12h4M12 12h8" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" /><circle cx="10" cy="12" r="2" /></svg>
                    Settings
                </button>
            </nav>
            <div id="update-box" class="update" hidden></div>
            <div class="side-foot">
                <div class="status" id="server-status" data-state="online"><span class="dot"></span><span class="label">Server online</span></div>
                <div id="launcher-version"></div>
            </div>
        </aside>

        <main>
            <section id="page-mods"><h1>Mods</h1><div id="mod-list"></div></section>
            <section id="page-settings" hidden><h1>Settings</h1><div id="settings-list"></div></section>
        </main>
    </div>

    <div id="toast" role="status"></div>
    <script src="/js/host.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
